<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación de Gael</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6, #f472b6);
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .avatar-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      background: #e0f2fe;
      border: 4px solid #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      color: #334155;
      margin-bottom: 6px;
    }

    .highlight {
      color: #f97316;
      font-weight: 700;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.6;
      margin-top: 12px;
    }

    .btn-back {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      background-color: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-back:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-container">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Gael" alt="Avatar saludando">
    </div>

    <h1>¡Hola a todos!</h1>
    <h1>Soy <span class="highlight">Gael</span></h1>

    <p>
      Bienvenidos a mi página web compañerooooos
    </p>

    <a href="índice.html" class="btn-back">Volver al inicio</a>
  </div>

</body>
</html>
